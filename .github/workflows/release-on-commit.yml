# .github/workflows/release-on-commit.yml
# Allow Read / Write Settings > Actions
# Release: bump package.json, add a "## [x.y.z]" section to CHANGELOG.md,
# then commit with "chore(release): vx.y.z"

name: Release VSIX on Commit Message

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract version from commit message
        id: extract_version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          if [[ ! "$SUBJECT" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Commit subject must be exactly 'chore(release): vX.Y.Z'."
            exit 1
          fi
          echo "VERSION=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match $VERSION."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          awk -v v="${VERSION#v}" '/^## \[/ { f = index($0, "## [" v "]") == 1; next } f' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "No '## [${VERSION#v}]' section found in CHANGELOG.md."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Get repository name
        run: echo "REPO_NAME=$(basename "$GITHUB_REPOSITORY")" >> "$GITHUB_ENV"

      - name: Package the extension
        id: package_vsix
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          VSIX_FILE="${REPO_NAME}-${VERSION}.vsix"
          npm run package -- --out "$VSIX_FILE"
          echo "VSIX_FILE=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.extract_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.package_vsix.outputs.VSIX_FILE }}
